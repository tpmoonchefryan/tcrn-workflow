name: P1 verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full clean history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Scope verification basis to the release ref
        run: |
          git for-each-ref --format='%(refname)' 'refs/remotes/origin/**' | grep -vx 'refs/remotes/origin/main' | xargs -r -n 1 git update-ref -d
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git reflog expire --expire=now --all
          git gc --prune=now --quiet

      - name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Acquire exact pnpm under explicit online bootstrap policy
        env:
          npm_config_offline: "false"
          npm_config_prefer_offline: "false"
          npm_config_ignore_scripts: "true"
          npm_config_audit: "false"
          npm_config_fund: "false"
          npm_config_update_notifier: "false"
          NO_UPDATE_NOTIFIER: "1"
        run: npm install --global pnpm@11.3.0 --ignore-scripts --no-audit --no-fund --no-update-notifier --prefer-online

      - name: Verify acquired pnpm version
        run: test "$(pnpm --version)" = "11.3.0"

      - name: Acquire exact dependencies explicitly
        env:
          npm_config_offline: "false"
          npm_config_prefer_offline: "false"
          npm_config_ignore_scripts: "true"
          npm_config_audit: "false"
          npm_config_fund: "false"
          npm_config_update_notifier: "false"
          NO_UPDATE_NOTIFIER: "1"
        run: pnpm install --frozen-lockfile --ignore-scripts --config.offline=false

      - name: Verify P1 offline
        run: pnpm verify:p1

      # TCRN-CROSS-INIT-020 INC-079 — every test file must have an owner. This is
      # the machine half of "a test no pipeline runs is a gate whose lifetime
      # equals the day it was written". Plant an unwired test and this step reds.
      - name: Every test file is wired to a pipeline
        run: node scripts/test-wiring-proof.mjs


  # S6 lesson-marker discrimination (TCRN-CROSS-STORY-147/148, re-shaped under
  # TCRN-CROSS-INC-034/035).
  #
  # ITS OWN JOB, ON PURPOSE. It used to be a step appended to `verify` after
  # `pnpm verify:p1`, which is fail-fast — so while the format and source-roster
  # gates were red it could never execute, and 「挂每 push CI，实测 6/6 绿」 was a
  # local measurement reported as a CI one. A separate job cannot be hidden by an
  # unrelated failure, and the converse holds too.
  #
  # NO DEPENDENCY INSTALL. The gate is plain node:test over a corpus; promptfoo is
  # deliberately not a dependency of this repository (see scripts/verify-s6.mjs for
  # why, and what it cost). Model-behaviour evaluation is a different claim with its
  # own gate, run from a host that carries the tool — the release-eval job that used
  # to sit here was removed with it: its predicate was a bare `workflow_dispatch`
  # with no tag, no release and no `needs`, so any manual run of this workflow
  # counted as a release gate.
  lessons:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout full clean history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: S6 lesson markers discriminate
        run: node scripts/verify-s6.mjs

      # INC-040. The S2 SSH-write observer classified correctly and exited 0 for an
      # entire observation window while every append threw into an empty catch, because
      # the sink's directory had been moved out of this repository. A dead channel and a
      # clean observation period produce the same empty log, so STORY-144's "no false
      # positives" promotion predicate was reading a vacuum.
      #
      # INC-041 corrected what this step verifies. It used to run a probe through an
      # in-process function call, which proved nothing about the command a host actually
      # starts — and the registration in this checkout was in fact unstartable from every
      # session root on the platform while this step reported the channel LIVE. The gate
      # now reads `.claude/settings.json` at the named project root, resolves the
      # registered PreToolUse/Bash command the way the host does, starts it as a process
      # from an unrelated working directory, feeds it one PreToolUse payload on stdin, and
      # reads its nonce back out of the sink. Exit 1 with OBSERVE_CHANNEL_SEVERED and a
      # per-root reason otherwise; exit 64 if the flags are not the ones written here.
      #
      # Only the repository root is named: a CI checkout has no platform root above it, so
      # naming one would assert something no checkout can satisfy. Consequence to know:
      # this step is red until `.claude/settings.json` is tracked in this repository. That
      # is the intended reading — an untracked registration is a registration no checkout
      # and no second host carries. Zero dependencies, like the rest of this job.
      - name: S2 observation channel is alive
        run: node scripts/ssh-write-observer.mjs --verify-channel --project-dir .

  # TCRN-CROSS-INIT-020 INC-079 — the PG backend tests. For seven months they were
  # green and orphaned: the offline `pnpm test` globs only `tests/`, so
  # `packages/pg-backend/test/*.test.mjs` never ran on any pipeline. The test-wiring
  # gate (`scripts/test-wiring-proof.mjs`) now reds on any test file with no owner;
  # the registry names this job as the PG tests' owner. THIS JOB is the proof that
  # the declaration is true — a real Postgres service, a real schema + append-only
  # trigger applied, and the PG suite executed (not skipped).
  #
  # The test-wiring gate is satisfied only because this job exists: delete it and
  # `pnpm test-wiring:proof` reds, because the registry entry names an owner that no
  # pipeline provides. The connection uses the service's mapped localhost port,
  # which is the correct address for a job running directly on the GitHub-hosted VM.
  verify-pg:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tcrn
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: tcrn_governance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tcrn -d tcrn_governance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout full clean history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Acquire exact pnpm under explicit online bootstrap policy
        env:
          npm_config_offline: "false"
          npm_config_prefer_offline: "false"
          npm_config_ignore_scripts: "true"
          npm_config_audit: "false"
          npm_config_fund: "false"
          NO_UPDATE_NOTIFIER: "1"
        run: npm install --global pnpm@11.3.0 --ignore-scripts --no-audit --no-fund --no-update-notifier --prefer-online

      - name: Acquire exact dependencies explicitly
        env:
          npm_config_offline: "false"
          npm_config_prefer_offline: "false"
          npm_config_ignore_scripts: "true"
          npm_config_audit: "false"
          npm_config_fund: "false"
          NO_UPDATE_NOTIFIER: "1"
        run: pnpm install --frozen-lockfile --ignore-scripts --config.offline=false

      - name: Build the engine
        run: pnpm build

      - name: Apply the isolated PG test schema (schema + append-only trigger)
        env:
          TCRN_PG_TEST_USER: tcrn
          TCRN_PG_TEST_PASSWORD: ci_test_password
          TCRN_PG_TEST_HOST: localhost
          TCRN_PG_TEST_PORT: 5432
          TCRN_PG_TEST_DATABASE: tcrn_governance
          TCRN_PG_TEST_SCHEMA: chain_test_cross
        run: node scripts/apply-pg-test-schema.mjs

      - name: Run the PG backend tests against the live service
        env:
          TCRN_PG_TEST_USER: tcrn
          TCRN_PG_TEST_PASSWORD: ci_test_password
          TCRN_PG_TEST_HOST: localhost
          TCRN_PG_TEST_PORT: 5432
          TCRN_PG_TEST_DATABASE: tcrn_governance
          TCRN_PG_TEST_SCHEMA: chain_test_cross
        run: node --test --test-concurrency=1 packages/pg-backend/test/*.test.mjs packages/pg-backend/test/evidence-roundtrip.mjs
